version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    groups:
      minor-och-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
